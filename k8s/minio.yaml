apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: minio-data
spec:
    accessModes: ["ReadWriteOnce"]
    storageClassName: local-path
    resources:
        requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: minio
spec:
    replicas: 1
    selector:
        matchLabels:
            app: minio
    template:
        metadata:
            labels:
                app: minio
        spec:
            containers:
                - name: minio
                  image: cgr.dev/chainguard/minio:latest
                  args: ["server", "/data"]
                  ports:
                      - containerPort: 9000
                  resources:
                      requests:
                          cpu: "250m"
                          memory: "512Mi"
                      limits:
                          cpu: "1"
                          memory: "1Gi"
                  volumeMounts:
                      - name: minio-storage
                        mountPath: /data
            volumes:
                - name: minio-storage
                  persistentVolumeClaim:
                      claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
    name: minio
spec:
    selector:
        app: minio
    ports:
        - port: 9000
          targetPort: 9000