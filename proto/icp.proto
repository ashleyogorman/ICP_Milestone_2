syntax = "proto3";
package icp;

service OcrService {
    rpc Recognize (CardRequest) returns (CardResponse);
}

message CardRequest {
    string request_id = 1;
    bytes image = 2; //png
}

// what ocr detects per (ideally) field
message Detection {
    // coordinates where 'text' was found on card 
    float x1 = 1;
    float y1 = 2;
    float x2 = 3;
    float y2 = 4;
    // what was actually found on the card
    string text = 5;
    //confidence
    float conf = 6; 
}

message CardResponse {
    string request_id = 1;
    repeated Detection detections = 2; // list of all the detections found on the card
    string variant = 3;
    int32 batch_size = 4;
    double queue_ms = 5;
    double inference_ms = 6;
  // assertion for fields WITHOUT labels
}